name: onion_grader_mobile
description: "AI Onion Quality Grading Mobile Application for Smart India Hackathon"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  camera: ^0.10.5+9
  tflite_flutter: ^0.10.4
  image: ^4.2.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  crypto: ^3.0.3
  cryptography: ^2.7.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0
  flutter_tts: ^4.0.2
  http: ^1.2.1
  uuid: ^4.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - config/grading_rules.json
    - assets/models/
